<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provva</title>

  <!--
    Porta de entrada única. Um só formulário e-mail+senha: tenta primeiro o login
    de vendedor (RPC, tablet.html) e, se o e-mail não existir como vendedor, tenta
    Supabase Auth (loja/operador/plataforma, painel.html). Ver PROVVA.md.
  -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #1A1A1A;
      --secondary: #C78D75;
      --bg: #F9F9F7;
      --surface: #FFFFFF;
      --muted: #8E8E93;
      --border: #E5E5E5;
      --erro: #DC2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--bg);
      color: var(--primary);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    .cartao {
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, .12);
      width: 100%;
      max-width: 380px;
      overflow: hidden;
    }
    .topo { background: var(--primary); color: #fff; padding: 30px 26px; text-align: center; }
    .topo h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 28px; margin: 0 0 6px; }
    .topo p { margin: 0; font-size: 12px; color: #C9C9C9; }
    form { padding: 26px 24px; display: flex; flex-direction: column; gap: 14px; }
    .campo { display: flex; flex-direction: column; gap: 6px; }
    .rotulo {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
      font-weight: 700; color: var(--muted);
    }
    input[type=email], input[type=password] {
      font-family: inherit; font-size: 14px; color: var(--primary);
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 12px; width: 100%;
    }
    input:focus { outline: 2px solid rgba(199, 141, 117, .45); outline-offset: 1px; }
    button {
      font-family: inherit; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; cursor: pointer; border: 0; border-radius: 10px;
      padding: 13px 18px; background: var(--primary); color: #fff; transition: background .15s, opacity .15s;
    }
    button:hover { background: var(--secondary); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .aviso-erro {
      background: #FEF2F2; border: 1px solid #FECACA; color: var(--erro);
      border-radius: 10px; padding: 10px 12px; font-size: 12px;
    }
    .dica { font-size: 11px; color: var(--muted); text-align: center; margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <div class="cartao">
    <div class="topo">
      <h1>Provva</h1>
      <p>Provador virtual para lojas</p>
    </div>
    <form id="form-login">
      <div id="login-erro" class="aviso-erro" hidden></div>
      <div class="campo">
        <label class="rotulo" for="login-email">E-mail</label>
        <input type="email" id="login-email" autocomplete="username" required>
      </div>
      <div class="campo">
        <label class="rotulo" for="login-senha">Senha</label>
        <input type="password" id="login-senha" autocomplete="current-password" required>
      </div>
      <button type="submit" id="btn-entrar">Entrar</button>
      <p class="dica">Vendedor, loja ou operador: o mesmo login leva para a tela certa.</p>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://agzknkebggfytlqcsuuu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFnemtua2ViZ2dmeXRscWNzdXV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4MDMzODUsImV4cCI6MjA4NjM3OTM4NX0.c2pFotvELY6ZopuQSMlzqUwluKc0HenIAvWuZVclQz0';

    const cliente = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = id => document.getElementById(id);

    function mostrarErro(msg) {
      const erro = $('login-erro');
      erro.textContent = msg;
      erro.hidden = false;
    }

    // Mensagem vinda de um redirect (ex.: sessão expirada no tablet).
    const erroInicial = new URLSearchParams(location.search).get('erro');
    if (erroInicial) mostrarErro(erroInicial);

    async function entrar(ev) {
      ev.preventDefault();
      const btn = $('btn-entrar');
      $('login-erro').hidden = true;
      btn.disabled = true;
      btn.textContent = 'Entrando...';

      const email = $('login-email').value.trim();
      const senha = $('login-senha').value;

      try {
        // Tenta Supabase Auth (vendedor, loja, operador ou plataforma).
        const { error: erroAuth } = await cliente.auth.signInWithPassword({ email, password: senha });
        if (erroAuth) {
          mostrarErro('E-mail ou senha incorretos.');
          return;
        }

        // Descobrir o papel do usuário e redirecionar.
        const { data: { user } } = await cliente.auth.getUser();
        if (!user) { mostrarErro('Sem acesso.'); return; }

        // Tenta obter perfil para vendedor (busca na tabela vendedores).
        try {
          const { data: vendedor } = await cliente
            .from('vendedores')
            .select('id')
            .eq('email', email)
            .single();
          if (vendedor) {
            location.href = 'tablet.html';
            return;
          }
        } catch (e) {
          // Não é vendedor, continua.
        }

        // Se chegou aqui, é loja/operador/plataforma.
        location.href = 'painel.html';
      } catch (e) {
        console.error('login:', e);
        mostrarErro('Sem conexão com o servidor. Tente novamente.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    $('form-login').addEventListener('submit', entrar);
  </script>
</body>

</html>
